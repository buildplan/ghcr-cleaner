version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "04:00"
    pull-request-branch-name:
      separator: "-"
    open-pull-requests-limit: 10
    assignees:
      - "buildplan"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    assignees:
      - "buildplan"
